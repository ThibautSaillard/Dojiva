openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dojiva API - gamified trading learning
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: academy
    description: Lessons, worlds and gamified progression
  - name: trading
    description: Simulator, strategies, journal, coach and badges
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /worlds:
    get:
      operationId: listWorlds
      tags: [academy]
      summary: List learning worlds with their lessons
      responses:
        "200":
          description: Worlds with lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/World"
  /lessons/{id}:
    get:
      operationId: getLesson
      tags: [academy]
      summary: Get a lesson with its interactive steps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /lessons/{id}/complete:
    post:
      operationId: completeLesson
      tags: [academy]
      summary: Mark a lesson as completed and award XP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonResult"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /progress:
    get:
      operationId: getProgress
      tags: [academy]
      summary: Get current player progress (XP, streak, level, completed lessons)
      responses:
        "200":
          description: Player progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
  /progress/onboarding:
    post:
      operationId: saveOnboarding
      tags: [academy]
      summary: Save onboarding answers and personalize the path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
  /premium/activate:
    post:
      operationId: activatePremium
      tags: [academy]
      summary: Activate a premium plan after confirmed payment
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  enum: [starter, pro, master]
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "402":
          description: Payment required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /badges:
    get:
      operationId: listBadges
      tags: [trading]
      summary: List badges with earned status
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"
  /simulator/scenario:
    post:
      operationId: createScenario
      tags: [trading]
      summary: Generate a new simulator scenario (visible candles only)
      responses:
        "200":
          description: New scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
  /simulator/trades:
    post:
      operationId: submitTrade
      tags: [trading]
      summary: Submit a trade decision and advance the market
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "200":
          description: Trade result with revealed candles and feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "404":
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /journal:
    get:
      operationId: getJournal
      tags: [trading]
      summary: Trading journal with statistics
      responses:
        "200":
          description: Journal entries and stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
  /strategies:
    get:
      operationId: listStrategies
      tags: [trading]
      summary: List saved strategies
      responses:
        "200":
          description: Strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Strategy"
    post:
      operationId: createStrategy
      tags: [trading]
      summary: Create a strategy from the builder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyInput"
      responses:
        "200":
          description: Created strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
  /strategies/{id}:
    delete:
      operationId: deleteStrategy
      tags: [trading]
      summary: Delete a strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /coach:
    post:
      operationId: getCoachAdvice
      tags: [trading]
      summary: Generate personalized AI coach advice from learning and trading history
      responses:
        "200":
          description: Coach advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachAdvice"
  /testimonials:
    get:
      operationId: listTestimonials
      tags: [academy]
      summary: List landing-page testimonials
      responses:
        "200":
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    World:
      type: object
      required: [id, title, subtitle, emoji, order, locked, lessons]
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string
        emoji:
          type: string
        order:
          type: integer
        locked:
          type: boolean
          description: True when the whole world is behind the premium paywall
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/LessonSummary"
    LessonSummary:
      type: object
      required: [id, worldId, title, order, icon, free, xpReward]
      properties:
        id:
          type: integer
        worldId:
          type: integer
        title:
          type: string
        order:
          type: integer
        icon:
          type: string
          description: Icon key (star, chart, candle, book, trophy, chest...)
        free:
          type: boolean
        xpReward:
          type: integer
    LessonDetail:
      type: object
      required: [id, worldId, title, order, icon, free, xpReward, steps]
      properties:
        id:
          type: integer
        worldId:
          type: integer
        title:
          type: string
        order:
          type: integer
        icon:
          type: string
        free:
          type: boolean
        xpReward:
          type: integer
        steps:
          type: array
          items:
            $ref: "#/components/schemas/LessonStep"
    LessonStep:
      type: object
      required: [id, type, prompt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [info, quiz, chart-quiz]
          description: info = animated explanation card; quiz = multiple choice; chart-quiz = question about a rendered candlestick chart
        prompt:
          type: string
        body:
          type: ["string", "null"]
          description: Explanation text for info steps
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: ["integer", "null"]
        explanation:
          type: ["string", "null"]
          description: Shown after answering
        chart:
          type: ["string", "null"]
          description: JSON-encoded candle data for chart-quiz steps
    LessonResult:
      type: object
      required: [score, total]
      properties:
        score:
          type: integer
        total:
          type: integer
    Progress:
      type: object
      required:
        [xp, level, streak, hearts, completedLessonIds, onboarded, premium, balance]
      properties:
        xp:
          type: integer
        level:
          type: integer
        streak:
          type: integer
        hearts:
          type: integer
        completedLessonIds:
          type: array
          items:
            type: integer
        onboarded:
          type: boolean
        goal:
          type: ["string", "null"]
        experienceLevel:
          type: ["string", "null"]
        markets:
          type: array
          items:
            type: string
        style:
          type: ["string", "null"]
        premium:
          type: boolean
        plan:
          type: ["string", "null"]
          description: Subscription plan (starter, pro, master) or null when free
        balance:
          type: number
          description: Virtual simulator capital in EUR
    OnboardingInput:
      type: object
      required: [goal, experienceLevel, markets, style]
      properties:
        goal:
          type: string
        experienceLevel:
          type: string
        markets:
          type: array
          items:
            type: string
        style:
          type: string
    OkMessage:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Badge:
      type: object
      required: [id, code, title, description, emoji, earned]
      properties:
        id:
          type: integer
        code:
          type: string
        title:
          type: string
        description:
          type: string
        emoji:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: ["string", "null"]
    Candle:
      type: object
      required: [o, h, l, c]
      properties:
        o:
          type: number
        h:
          type: number
        l:
          type: number
        c:
          type: number
    Scenario:
      type: object
      required: [id, market, timeframe, candles, balance]
      properties:
        id:
          type: integer
        market:
          type: string
        timeframe:
          type: string
        candles:
          type: array
          description: Visible candles only (the future stays hidden)
          items:
            $ref: "#/components/schemas/Candle"
        balance:
          type: number
    TradeInput:
      type: object
      required: [scenarioId, direction]
      properties:
        scenarioId:
          type: integer
        direction:
          type: string
          enum: [buy, sell, wait]
        entry:
          type: ["number", "null"]
        stopLoss:
          type: ["number", "null"]
        takeProfit:
          type: ["number", "null"]
        riskPercent:
          type: ["number", "null"]
          description: Percent of balance risked (default 1)
        emotion:
          type: ["string", "null"]
          description: How the user felt (confiant, stressé, neutre...)
        strategyId:
          type: ["integer", "null"]
    TradeResult:
      type: object
      required: [outcome, pnl, balance, futureCandles, feedback, riskReward]
      properties:
        outcome:
          type: string
          enum: [take-profit, stop-loss, expired, waited]
        pnl:
          type: number
        balance:
          type: number
        exitPrice:
          type: ["number", "null"]
        riskReward:
          type: ["number", "null"]
        futureCandles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        feedback:
          type: array
          description: Pedagogical feedback lines in French
          items:
            type: string
    JournalEntry:
      type: object
      required: [id, market, direction, outcome, pnl, createdAt]
      properties:
        id:
          type: integer
        market:
          type: string
        direction:
          type: string
        outcome:
          type: string
        pnl:
          type: number
        riskReward:
          type: ["number", "null"]
        emotion:
          type: ["string", "null"]
        strategyName:
          type: ["string", "null"]
        feedback:
          type: array
          items:
            type: string
        createdAt:
          type: string
    JournalStats:
      type: object
      required: [totalTrades, wins, losses, winRate, avgRiskReward, balance, bestPnl, worstPnl]
      properties:
        totalTrades:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        winRate:
          type: number
        avgRiskReward:
          type: ["number", "null"]
        balance:
          type: number
        bestPnl:
          type: ["number", "null"]
        worstPnl:
          type: ["number", "null"]
    Journal:
      type: object
      required: [entries, stats]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        stats:
          $ref: "#/components/schemas/JournalStats"
    StrategyInput:
      type: object
      required: [name, market, style, timeframe, context, entryRules, riskPercent]
      properties:
        name:
          type: string
        market:
          type: string
        style:
          type: string
        timeframe:
          type: string
        context:
          type: array
          items:
            type: string
        entryRules:
          type: array
          items:
            type: string
        stopLossRule:
          type: ["string", "null"]
        takeProfitRule:
          type: ["string", "null"]
        riskPercent:
          type: number
    Strategy:
      type: object
      required: [id, name, market, style, timeframe, context, entryRules, riskPercent, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        market:
          type: string
        style:
          type: string
        timeframe:
          type: string
        context:
          type: array
          items:
            type: string
        entryRules:
          type: array
          items:
            type: string
        stopLossRule:
          type: ["string", "null"]
        takeProfitRule:
          type: ["string", "null"]
        riskPercent:
          type: number
        createdAt:
          type: string
    CoachAdvice:
      type: object
      required: [sections, generatedAt]
      properties:
        sections:
          type: array
          items:
            type: object
            required: [category, title, message]
            properties:
              category:
                type: string
                enum: [apprentissage, simulation, discipline]
              title:
                type: string
              message:
                type: string
        generatedAt:
          type: string
    Testimonial:
      type: object
      required: [id, name, date, rating, text]
      properties:
        id:
          type: integer
        name:
          type: string
        date:
          type: string
        rating:
          type: integer
        text:
          type: string
